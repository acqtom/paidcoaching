<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metrics Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* Paidcoaching theme -- cream + indigo + bold black borders, matching
   public/sales-board-app/index.html. */
:root{
  color-scheme:light;
  --page:#fbfaf3;
  --ink:#111111;
  --ink-2:#575a66;
  --ink-3:#8a8d99;
  --rule:#111111;
  --rule-2:#e3e0d4;
  --accent:#3c3ee3;
  --badge-bg:#e8ecfc;
  --bad:#e34948;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1400px;margin:0 auto;padding:28px 28px 72px;}
@media(max-width:600px){.wrap{padding:20px 16px 56px;}}

/* ── Header ── */
.header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.brand img{height:40px;width:auto;object-fit:contain;display:block;}
.header-meta{text-align:right;}
.header-eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;}
.header-title{font-size:20px;font-weight:700;margin-top:2px;}

.sync-banner{background:#fdecea;border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;text-align:center;margin-bottom:16px;}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.client-rail{display:flex;gap:6px;}
.client-tab{background:var(--badge-bg);color:var(--accent);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;}
.toolbar-spacer{flex:1;}

.date-range-bar{position:relative;}
.drb-btn{background:#fff;border:1.5px solid var(--rule);color:var(--ink);border-radius:20px;padding:8px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;}
#dateRangeLabel{font-variant-numeric:tabular-nums;}
.drb-chev{transition:transform .14s;}
.drb-btn.open .drb-chev{transform:rotate(180deg);}
.drb-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:600;background:#fff;border:2px solid var(--rule);border-radius:16px;padding:18px;min-width:300px;}
.drb-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.drb-preset{background:#fff;border:1.5px solid var(--rule);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink-2);}
.drb-preset:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
.drb-inputs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.drb-lbl{font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.drb-lbl input[type=date]{background:#fff;border:1.5px solid var(--rule-2);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--ink);font-family:inherit;outline:none;}
.drb-lbl input[type=date]:focus{border-color:var(--accent);}
.drb-apply{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;}
.drb-apply:hover{opacity:.9;}

.reset-btn{background:#fff;border:1.5px solid var(--rule);color:var(--ink-2);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.reset-btn:hover,.reset-btn.confirming{border-color:var(--bad);color:var(--bad);}

/* ── Stage tables ── */
.funnel{display:flex;flex-direction:column;gap:20px;}
.stage{background:#fff;border:2px solid var(--rule);border-radius:16px;overflow:hidden;}
.stage-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;user-select:none;border-bottom:1px solid var(--rule);}
.stage.collapsed .stage-head{border-bottom:none;}
.stage-title{display:flex;align-items:center;gap:10px;}
.stage-title .label{font-size:15px;font-weight:700;}
.stage-title .tag{background:var(--badge-bg);color:var(--accent);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;}
.stage-head .chev{color:var(--ink-3);transition:transform .2s;}
.stage.collapsed .chev{transform:rotate(-90deg);}
.stage-head .meta-txt{font-size:12px;color:var(--ink-3);}
.stage-body{overflow-x:auto;}
.stage.collapsed .stage-body{display:none;}
table.metrics{width:100%;border-collapse:collapse;font-size:13px;}
table.metrics th{text-align:center;color:var(--ink-3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px 8px;border-bottom:1px solid var(--rule-2);white-space:nowrap;}
table.metrics th:first-child,table.metrics td:first-child{text-align:left;padding-left:20px;}
table.metrics td{padding:8px;border-bottom:1px solid var(--rule-2);vertical-align:middle;text-align:center;}
table.metrics tr:last-child td{border-bottom:none;}
.metric-name{font-weight:600;font-size:14px;white-space:nowrap;}
th.summary-col,td.summary-col{border-left:1px solid var(--rule-2);}
.avg-box,.avg-box:hover{background:var(--badge-bg);border-color:var(--badge-bg);}
.avg-val{flex:1;min-width:64px;padding:6px 4px;font-size:14px;line-height:17px;min-height:29px;font-weight:700;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;}
td.avg-cell .input-cell,td.target-cell .input-cell{min-width:110px;}

.input-cell{display:flex;align-items:center;justify-content:center;background:var(--page);border:1.5px solid var(--rule-2);border-radius:10px;padding:2px 4px;}
.input-cell:hover{border-color:var(--ink-3);}
.input-cell:focus-within{border-color:var(--accent);background:#fff;}
.input-cell input{width:100%;min-width:64px;background:transparent;border:none;color:var(--ink);font-size:14px;padding:6px 4px;text-align:center;font-family:inherit;font-variant-numeric:tabular-nums;outline:none;}
.input-cell .affix{flex:none;font-size:13px;color:var(--ink-3);}

.trend-select{width:110px;padding:7px 10px;border:1.5px solid var(--rule-2);border-radius:20px;background:#fff;color:var(--ink-3);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;text-align:center;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;}
.trend-select:focus{outline:2px solid var(--accent);outline-offset:1px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="brand"><img src="/logo.png" alt="Paidcoaching.com"></div>
    <div class="header-meta">
      <div class="header-eyebrow">Metrics Tracking</div>
      <div class="header-title">Growth Engine</div>
    </div>
  </div>

  <div id="sync-banner" class="sync-banner" hidden></div>

  <div class="toolbar">
    <div class="client-rail" id="clientRow"></div>
    <div class="date-range-bar" id="dateRangeBar">
      <button class="drb-btn" id="drbToggle">
        <span id="dateRangeLabel">Loading…</span>
        <svg class="drb-chev" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="drb-panel" id="drbPanel" style="display:none;">
        <div class="drb-presets">
          <button class="drb-preset" data-preset="7">Last 7 days</button>
          <button class="drb-preset" data-preset="14">Last 14 days</button>
          <button class="drb-preset" data-preset="30">Last 30 days</button>
          <button class="drb-preset" data-preset="90">Last 90 days</button>
        </div>
        <div class="drb-inputs">
          <label class="drb-lbl">From<input type="date" id="drbFrom"></label>
          <label class="drb-lbl">To<input type="date" id="drbTo"></label>
        </div>
        <button class="drb-apply" id="drbApply">Apply</button>
      </div>
    </div>
    <div class="toolbar-spacer"></div>
    <button class="reset-btn" id="resetBtn">Reset data</button>
  </div>

  <div class="funnel" id="stages"></div>
</div>

<script>
/* ── Data model ── */
// Metric ids are kept from the old VSL config so existing values (and
// the Sales Team Board push in src/lib/metrics-tracking-state.ts) carry
// over -- e.g. Cost Per Call is still stored under `cpbc`.
const STAGES=[
  {id:'marketing',label:'Marketing'},
  {id:'funnel',   label:'Funnel Metrics'},
  {id:'sales',    label:'Sales Metrics'},
];
const METRIC_META=[
  {id:'ad_spend',       stage:'marketing',label:'Ad Spend (Meta)',     format:'currency',dir:'higher',target:null},
  {id:'hook',           stage:'marketing',label:'Hook Rate',           format:'percent', dir:'higher',target:40},
  {id:'cpc',            stage:'marketing',label:'Cost Per Click',      format:'currency',dir:'lower', target:1.00},
  {id:'ctr',            stage:'marketing',label:'CTR Link',            format:'percent', dir:'higher',target:2.00},
  {id:'cpl',            stage:'marketing',label:'Cost Per Lead',       format:'currency',dir:'lower', target:100},
  {id:'cpbc',           stage:'marketing',label:'Cost Per Call',       format:'currency',dir:'lower', target:null},
  {id:'vsl_play',       stage:'funnel',   label:'VSL Play Rate',       format:'percent', dir:'higher',target:null},
  {id:'vsl_engage',     stage:'funnel',   label:'VSL Engagement Rate', format:'percent', dir:'higher',target:40},
  {id:'lp_app',         stage:'funnel',   label:'LP Click → App Rate', format:'percent', dir:'higher',target:4},
  {id:'connection_rate',stage:'sales',    label:'Connection Rate',     format:'percent', dir:'higher',target:null},
  {id:'show_rate',      stage:'sales',    label:'Show Rate',           format:'percent', dir:'higher',target:80},
  {id:'close_rate',     stage:'sales',    label:'Close Rate',          format:'percent', dir:'higher',target:60},
  {id:'aov',            stage:'sales',    label:'AOV',                 format:'currency',dir:'higher',target:7000},
  {id:'cac',            stage:'sales',    label:'CAC',                 format:'currency',dir:'lower', target:null},
  {id:'cash',           stage:'sales',    label:'Cash Collected',      format:'currency',dir:'higher',target:null},
  {id:'revenue_gen',    stage:'sales',    label:'Revenue Generated',   format:'currency',dir:'higher',target:null},
  {id:'roas',           stage:'sales',    label:'ROAS',                format:'multiple',dir:'higher',target:7},
];

/* ── Date helpers ── */
function toISO(d){return d.toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return toISO(d);}
function dateLabel(iso){return new Date(iso+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});}
function weekdayLabel(iso){return new Date(iso+'T00:00:00Z').toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'});}
function weekDates(s){return[0,1,2,3,4,5,6].map(i=>addDays(s,i));}
function todayISO(){return toISO(new Date());}

/* ── Date range state ── */
let rangeStart='', rangeEnd='';
function initRange(){const t=todayISO();rangeEnd=t;rangeStart=addDays(t,-6);}
function rangeDates(){
  if(!rangeStart||!rangeEnd)return[];
  const dates=[];let d=new Date(rangeStart+'T00:00:00Z');
  const end=new Date(rangeEnd+'T00:00:00Z');
  while(d<=end&&dates.length<365){dates.push(toISO(d));d=new Date(d.getTime()+86400000);}
  return dates;
}
function getVals(c,id){const store=(c.data&&c.data[id])||{};return rangeDates().map(d=>store[d]!=null?store[d]:null);}
function setVal(id,date,raw){
  const c=currentClient();if(!c.data)c.data={};if(!c.data[id])c.data[id]={};
  const v=raw===''||raw===null?null:parseFloat(raw);
  if(v===null||isNaN(v))delete c.data[id][date];else c.data[id][date]=v;
  queueSave();
}
function migrateClient(cl){
  if(cl.data)return cl;cl.data={};
  (cl.weeks||[]).forEach(w=>{
    const dates=weekDates(w.start);
    Object.keys(w.metrics||{}).forEach(id=>{
      if(!cl.data[id])cl.data[id]={};
      (w.metrics[id]||[]).forEach((v,i)=>{if(v!==null&&v!==undefined&&i<dates.length)cl.data[id][dates[i]]=v;});
    });
  });
  delete cl.weeks;
  return cl;
}

/* ── Seed data ── */
// The embedding page passes ?user=<username> (the person's own Student
// Portal login handle) -- this tool is single-user per browser, so there's
// no "add client" concept here; the one implicit client is just them.
function studentUsername(){
  return new URLSearchParams(location.search).get('user')||'you';
}
// The label always comes from the logged-in username (or the board's
// name for an admin viewing one of their multi-boards), never from a
// cached copy -- a cached name is how one account's label ended up on
// another account that used the same browser.
function expectedClientName(){
  const boardName=new URLSearchParams(location.search).get('board_name');
  return boardName || ('@'+studentUsername());
}
function seedDefaultClient(){
  return{id:'default',name:expectedClientName(),data:{}};
}
let CLIENTS=[seedDefaultClient()];
let currentClientId='default', trendMode='week';

/* ── Storage ── */
// Set only by the React wrapper page's board switcher (see
// src/app/dashboard/tracking/page.tsx) when an admin is viewing one of
// their multi-boards' own Metrics Tracking data
// (0023_multi_sales_boards.sql) instead of their single per-account one.
// Declared here (rather than down with the rest of the server-sync
// state below) since STORE_KEY needs it immediately.
const urlBoard=new URLSearchParams(location.search).get('board');
// Board-scoped when viewing one of an admin's multi-boards -- otherwise
// every board shared this one key, so a value cached from one board (or
// the original single-account view) would look like "this browser
// already has data" for every other board too, triggering the
// unwanted-import prompt below and, if accepted, actually copying that
// stale value into an unrelated board's own server row.
const STORE_KEY=urlBoard?`growth-dashboard-v4:board:${urlBoard}`:`growth-dashboard-v4:user:${studentUsername()}`;
let saveTimer=null;
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify({CLIENTS,currentClientId,rangeStart,rangeEnd}));}catch(e){}},400);
  queueServerSave();
}

/* ── Server sync ──
   The metric *values* (currentClient().data only -- not targets, tab
   or the date range, which stay
   local/per-browser exactly as before) are additionally synced to this
   account's row in Supabase, so they're the same across every device
   and so the Sales Team Board can automatically push closed-call numbers
   in here (see metrics_tracking_state / src/lib/metrics-tracking-state.ts).
   Local save above is unchanged and still happens even if this fails. */
let dataReady=false;
let serverSaveTimer=null;
let pollTimer=null;
let pollInFlight=false;

const syncBanner=document.getElementById('sync-banner');
function showSyncError(msg){syncBanner.textContent=msg;syncBanner.hidden=false;}
function clearSyncError(){syncBanner.hidden=true;}

async function apiPost(path,body){
  const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){const err=new Error(data.error||'Request failed');err.status=res.status;throw err;}
  return data;
}

async function loadServerData(){
  const path=urlBoard?`/api/metrics-boards/session?board=${encodeURIComponent(urlBoard)}`:'/api/tracking/session';
  const res=await apiPost(path);
  return res.data||{};
}

async function saveServerData(){
  if(!dataReady)return;
  try{
    const path=urlBoard?`/api/metrics-boards/save?board=${encodeURIComponent(urlBoard)}`:'/api/tracking/save';
    await apiPost(path,{data:currentClient().data||{}});
    clearSyncError();
  }catch(e){
    console.error('Failed to save tracking data to server:',e);
    showSyncError("Couldn't save your last change to your account. Check your connection — it will retry automatically, but refresh to be safe.");
  }
}

function queueServerSave(){clearTimeout(serverSaveTimer);serverSaveTimer=setTimeout(saveServerData,600);}

function hasAnyMetricValues(data){
  return!!data&&Object.keys(data).some(id=>!id.startsWith('__')&&data[id]&&Object.keys(data[id]).length>0);
}

// Re-fetches this account's synced data and re-renders in place -- skipped
// entirely while the user is mid-edit in any input on the page, so a poll
// (e.g. right after a sales rep logs a call elsewhere) can never yank a
// value out from under active typing.
async function pollServerData(){
  if(pollInFlight||!dataReady)return;
  const active=document.activeElement;
  if(active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA'))return;
  pollInFlight=true;
  try{
    currentClient().data=await loadServerData();
    renderAll();
    clearSyncError();
  }catch(e){
    console.error('Poll for tracking updates failed:',e);
  }finally{
    pollInFlight=false;
  }
}
function startPolling(){stopPolling();pollTimer=setInterval(pollServerData,8000);}
function stopPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=null;}
window.addEventListener('focus',pollServerData);

(async function bootServerSync(){
  try{
    const serverData=await loadServerData();
    const serverHasData=hasAnyMetricValues(serverData);
    const localHasData=hasAnyMetricValues(currentClient().data);
    dataReady=true;
    if(serverHasData){
      currentClient().data=serverData;
    }else if(localHasData){
      const wantsImport=confirm("Import this browser's existing Metrics Tracking numbers into your account?\n\nChoose Cancel to start your account fresh instead.");
      if(wantsImport){
        await saveServerData();
      }else{
        currentClient().data={};
      }
    }
    renderAll();
    startPolling();
  }catch(e){
    console.error('Failed to load tracking data from server:',e);
    showSyncError("Could not load your synced data. Refresh the page — until then, changes here may not be saved to your account, and Sales Board numbers won't appear.");
  }
})();
function loadStored(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const p=JSON.parse(raw);
      if(p.CLIENTS&&p.CLIENTS.length){CLIENTS=p.CLIENTS.map(migrateClient);currentClientId=p.currentClientId||CLIENTS[0].id;CLIENTS[0].name=expectedClientName();}
      // One-time migration: browsers that saved data under the old
      // hardcoded "EDUCATR" default (before clients were renamed to the
      // person's own @username) get renamed automatically here.
      if(CLIENTS.length===1&&CLIENTS[0].name==='EDUCATR'){CLIENTS[0].name='@'+studentUsername();queueSave();}
      if(p.rangeStart)rangeStart=p.rangeStart;
      if(p.rangeEnd)rangeEnd=p.rangeEnd;
    }
  }catch(e){}
}

/* ── Accessors ── */
function currentClient(){return CLIENTS.find(c=>c.id===currentClientId)||CLIENTS[0];}

/* ── Formatting ── */
function fmt(v,f){
  if(v===null||v===undefined||isNaN(v))return'';
  switch(f){
    case'currency':return'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:v%1===0?0:2,maximumFractionDigits:2});
    case'percent':return Number(v).toFixed(2).replace(/\.00$/,'')+'%';
    case'multiple':return Number(v).toFixed(1)+'x';
    case'rating':return Number(v).toFixed(1)+'/5';
    default:return Number(v).toLocaleString();
  }
}
function avg(vals){const n=vals.filter(v=>v!==null&&v!==undefined&&!isNaN(v));if(!n.length)return null;return n.reduce((a,b)=>a+b,0)/n.length;}
function statusColor(vals,target,dir){const a=avg(vals);if(a===null||target===null||target===undefined)return'muted';const r=dir==='higher'?a/target:target/a;if(r>=1)return'good';if(r>=0.75)return'warn';return'bad';}
function statusHex(s){return s==='good'?'#16A34A':s==='warn'?'#D97706':s==='bad'?'#DC2626':'#B8B8B8';}
function getTarget(c,meta){if(c.targets&&Object.prototype.hasOwnProperty.call(c.targets,meta.id))return c.targets[meta.id];return meta.target;}
function setClientTarget(id,raw){const c=currentClient();if(!c.targets)c.targets={};c.targets[id]=raw===''?null:parseFloat(raw);queueSave();}
// Manual Trend status per metric -- stored under a reserved `__trend` key
// inside the client's data so it syncs to the account like the values do.
const TREND_OPTIONS=[{v:'red',label:'URGENT',hex:'#DC2626'},{v:'orange',label:'WATCH',hex:'#D97706'},{v:'green',label:'OKAY',hex:'#16A34A'}];
function getTrend(c,id){return (c.data&&c.data.__trend&&c.data.__trend[id])||'';}
function setTrend(id,val){const c=currentClient();if(!c.data)c.data={};if(!c.data.__trend)c.data.__trend={};if(val)c.data.__trend[id]=val;else delete c.data.__trend[id];queueSave();}
function trendSelect(id,value){
  const opt=TREND_OPTIONS.find(o=>o.v===value);
  const style=opt?` style="background:${opt.hex};color:#fff;border-color:${opt.hex};"`:'';
  return`<select class="trend-select" data-metric="${id}"${style}>
    <option value="">-</option>
    ${TREND_OPTIONS.map(o=>`<option value="${o.v}"${o.v===value?' selected':''}>${o.label}</option>`).join('')}
  </select>`;
}

/* ── Editable number ── */
function inputCell(value,format,attrs){
  const val=(value===null||value===undefined)?'':value;
  return`<div class="input-cell"><input type="text" inputmode="decimal" ${attrs} value="${val}"></div>`;
}

// Targets keep whichever unit the metric itself is measured in -- a
// plain number for most metrics, but a visible $/%/x/÷5 label for
// currency/percent/multiple/rating ones, so e.g. a Show Up Rate target
// reads as a percentage and an AOV target reads as a dollar amount
// rather than a bare, ambiguous number. The label is just a static
// span next to the input, not part of its typed value -- you still
// just type the number (`80`, `7000`), same as every other cell.
function unitAffixes(format){
  const prefix=format==='currency'?'<span class="affix">$</span>':'';
  const suffix=format==='percent'?'<span class="affix">%</span>'
    :format==='multiple'?'<span class="affix">x</span>'
    :format==='rating'?'<span class="affix">/5</span>'
    :'';
  return{prefix,suffix};
}
function targetInputCell(value,format,attrs){
  const val=(value===null||value===undefined)?'':value;
  const{prefix,suffix}=unitAffixes(format);
  return`<div class="input-cell">${prefix}<input type="text" inputmode="decimal" ${attrs} value="${val}">${suffix}</div>`;
}
// Same box as the target cell, but read-only -- the average is computed
// from the day cells, never typed.
function avgBoxCell(value,format){
  const val=(value===null||value===undefined||isNaN(value))?'':Number(value).toLocaleString(undefined,{maximumFractionDigits:2});
  const{prefix,suffix}=unitAffixes(format);
  return`<div class="input-cell avg-box">${prefix}<span class="avg-val">${val}</span>${suffix}</div>`;
}

/* ── Client label ── */
// Single implicit client per logged-in person -- no add/rename/delete UI,
// just a static label showing who this data belongs to.
function renderClientTabs(){
  const row=document.getElementById('clientRow');row.innerHTML='';
  const label=document.createElement('span');label.className='client-tab active';
  label.textContent=currentClient().name;
  row.appendChild(label);
}

/* ── Date range label ── */
function renderDateLabel(){
  if(!rangeStart||!rangeEnd)return;
  const el=document.getElementById('dateRangeLabel');
  if(el)el.textContent=`${dateLabel(rangeStart)} – ${dateLabel(rangeEnd)}`;
  const fromEl=document.getElementById('drbFrom');
  const toEl=document.getElementById('drbTo');
  if(fromEl)fromEl.value=rangeStart;
  if(toEl)toEl.value=rangeEnd;
}


/* ── Funnel stage tables ── */
function renderStages(){
  const c=currentClient();const dates=rangeDates();
  const container=document.getElementById('stages');container.innerHTML='';
  STAGES.forEach(stage=>{
    const metas=METRIC_META.filter(m=>m.stage===stage.id);
    const div=document.createElement('div');div.className='stage';
    const rows=metas.map(meta=>{
      const vals=getVals(c,meta.id);const target=getTarget(c,meta);
      const a=avg(vals);
      const dayCells=dates.map((date,i)=>`<td>${inputCell(vals[i],meta.format,`data-metric="${meta.id}" data-date="${date}"`)}</td>`).join('');
      return`<tr data-metric="${meta.id}"><td><div class="metric-name">${meta.label}</div></td>${dayCells}<td class="avg-cell summary-col">${avgBoxCell(a,meta.format)}</td><td class="target-cell">${targetInputCell(target,meta.format,`class="stage-target-input" data-metric="${meta.id}"`)}</td><td>${trendSelect(meta.id,getTrend(c,meta.id))}</td></tr>`;
    }).join('');
    const onTarget=metas.filter(m=>statusColor(getVals(c,m.id),getTarget(c,m),m.dir)==='good').length;
    div.innerHTML=`
      <div class="stage-head">
        <div class="stage-title">
          <span class="label">${stage.label}</span>
          <span class="tag">${metas.length} metrics</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="meta-txt">${onTarget} on target</span>
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="stage-body">
        <table class="metrics"><thead><tr>
          <th style="min-width:200px;">Metric</th>
          ${dates.map(d=>`<th>${weekdayLabel(d)}<br><span style="font-weight:400;font-size:11px;text-transform:none;letter-spacing:0;">${dateLabel(d)}</span></th>`).join('')}
          <th class="summary-col">Avg</th><th>Target</th><th>Priority</th>
        </tr></thead><tbody>${rows}</tbody></table>
      </div>`;
    container.appendChild(div);
    div.querySelector('.stage-head').onclick=()=>div.classList.toggle('collapsed');
  });
  container.querySelectorAll('input[data-date]').forEach(inp=>{
    inp.oninput=e=>{
      const id=e.target.dataset.metric,date=e.target.dataset.date;
      setVal(id,date,e.target.value);
      const aid=id,adate=date;renderStages();
      const el=document.querySelector(`input[data-metric="${aid}"][data-date="${adate}"]`);
      if(el){el.focus();const len=el.value.length;el.setSelectionRange(len,len);}
    };
  });
  container.querySelectorAll('.trend-select').forEach(sel=>{
    sel.onchange=e=>{setTrend(e.target.dataset.metric,e.target.value);renderStages();};
  });
  container.querySelectorAll('.stage-target-input').forEach(inp=>{
    inp.oninput=e=>{
      const id=e.target.dataset.metric;setClientTarget(id,e.target.value);renderStages();
      const el=document.querySelector(`.stage-target-input[data-metric="${id}"]`);
      if(el){el.focus();const len=el.value.length;el.setSelectionRange(len,len);}
    };
  });
}


/* ── Reset ── */
let resetArmed=false,resetTimer=null;
document.getElementById('resetBtn').onclick=e=>{
  if(!resetArmed){resetArmed=true;e.target.textContent='Confirm reset';e.target.classList.add('confirming');resetTimer=setTimeout(()=>{resetArmed=false;e.target.textContent='Reset data';e.target.classList.remove('confirming');},3000);return;}
  clearTimeout(resetTimer);resetArmed=false;e.target.textContent='Reset data';e.target.classList.remove('confirming');
  const c=currentClient();c.data={};queueSave();renderAll();
};

/* ── Main render ── */
function renderAll(){renderClientTabs();renderDateLabel();renderStages();}

/* ── Date picker events ── */
document.getElementById('drbToggle').addEventListener('click',()=>{
  const panel=document.getElementById('drbPanel');
  const btn=document.getElementById('drbToggle');
  const open=panel.style.display==='none';
  panel.style.display=open?'block':'none';
  btn.classList.toggle('open',open);
});
document.addEventListener('click',e=>{
  const bar=document.getElementById('dateRangeBar');
  if(bar&&!bar.contains(e.target)){
    document.getElementById('drbPanel').style.display='none';
    document.getElementById('drbToggle').classList.remove('open');
  }
});
document.getElementById('drbPanel').addEventListener('click',e=>e.stopPropagation());
document.querySelectorAll('.drb-preset').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const days=parseInt(btn.dataset.preset);
    const t=todayISO();
    rangeEnd=t;rangeStart=addDays(t,-(days-1));
    document.getElementById('drbFrom').value=rangeStart;
    document.getElementById('drbTo').value=rangeEnd;
  });
});
document.getElementById('drbApply').addEventListener('click',()=>{
  const f=document.getElementById('drbFrom').value;
  const t=document.getElementById('drbTo').value;
  if(f&&t&&f<=t){rangeStart=f;rangeEnd=t;}
  document.getElementById('drbPanel').style.display='none';
  document.getElementById('drbToggle').classList.remove('open');
  queueSave();renderAll();
});


initRange();loadStored();if(!rangeStart||!rangeEnd)initRange();renderAll();
</script>
</body>
</html>
